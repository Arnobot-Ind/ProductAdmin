# nginx site for the backend: /etc/nginx/sites-available/productadmin (symlinked into sites-enabled).
# Everything goes to the Node process on 127.0.0.1:4000; port 4000 is never opened in the firewall.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name api.arnobot.in _;       # certbot --nginx -d api.arnobot.in once DNS points here, then COOKIE_SECURE=true

    client_max_body_size 1100m;         # release packages up to 1 GB (MAX_UPLOAD_MB); robot files up to ARCHIVE_UPLOAD_MAX_MB
    proxy_request_buffering off;        # stream robot uploads straight to Node → S3
    proxy_buffering off;                # stream video straight to the browser

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;           # Socket.IO
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
