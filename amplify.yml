# AWS Amplify Hosting (SSR / WEB_COMPUTE) for the admin panel in frontend/.
# Amplify console: set the environment variable AMPLIFY_MONOREPO_APP_ROOT=frontend.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22 && nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
